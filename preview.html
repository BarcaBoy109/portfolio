<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Portfolio responsive review</title><style>body{margin:0;background:#c9c7cf;display:grid;place-items:center;padding:20px}iframe{border:0;width:390px;height:900px;background:#ebe9f2}label{font:14px sans-serif;display:block;margin-bottom:15px}select{font:inherit;padding:6px}</style></head><body><label>Review viewport <select id="size"><option>390</option><option>320</option><option>600</option><option>768</option></select> px</label><p id="report" style="font:12px sans-serif"></p><iframe title="Portfolio mobile preview" src="/"></iframe><script>document.querySelector('select').addEventListener('change',e=>document.querySelector('iframe').style.width=e.target.value+'px');const frame=document.querySelector("iframe");function report(){const d=frame.contentDocument;document.querySelector("#report").textContent="Viewport "+d.documentElement.clientWidth+"px / Content "+d.documentElement.scrollWidth+"px";}frame.addEventListener("load",()=>{report();new ResizeObserver(report).observe(frame);});</script></body></html>
